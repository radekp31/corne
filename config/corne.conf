# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Corne RP"

# Display Settings (The "Eye Candy" Saver)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Power & Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Connectivity (Reverted to default 6KRO for speed/battery)
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO is not set
