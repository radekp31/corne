# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Corne RP"

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
#10s
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Power & Sleep
CONFIG_ZMK_SLEEP=y
# 5 min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Bluetooth – only boost if actually needed, max: *_PLUS_8
# CONFIG_BT_CTLR_TX_PWR_PLUS_4 is not set
# (use default 0 dBm)
# or, if you know you need it:
# CONFIG_BT_CTLR_TX_PWR_PLUS_2=y

# Connectivity
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO is not set

# LED control
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
